name: Refresh stats card

on:
  schedule:
    - cron: "17 4 * * *"     # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate assets/stats.svg
        env:
          # STATS_TOKEN (a personal access token with read:user) sees all your
          # contributions across every repo. Without it, the default GITHUB_TOKEN
          # can only see contributions inside THIS repo, so commit/PR/issue counts
          # come out far too low. Add the secret and these numbers become correct.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: node scripts/gen-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/stats.svg; then
            echo "No change."
          else
            git add assets/stats.svg
            git commit -m "Refresh stats card [skip ci]"
            git push
          fi
