<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nilabha Mukherjee — Security, IoT, Applied AI">
  <title>Nilabha Mukherjee</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#101d1a"/>
      <stop offset="100%" stop-color="#0a1014"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="1198" height="318" rx="20"/></clipPath>
    <clipPath id="av"><circle cx="334" cy="128" r="54"/></clipPath>
  </defs>

  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .nm { font-size: 54px; font-weight: 700; letter-spacing: -1.2px; fill: #eafff8; }
    .tg { font-size: 16px; font-weight: 500; letter-spacing: 3.4px; fill: #5eead4; }
    .ch { font-size: 15px; font-weight: 600; letter-spacing: 1.7px; }
    .an { opacity: 0; animation: rise .85s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .16s; }
    .d3 { animation-delay: .27s; } .d4 { animation-delay: .38s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .swp { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-420px); }
      55%  { transform: translateX(1240px); }
      100% { transform: translateX(1240px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .an { animation: none; opacity: 1; }
      .swp { animation: none; opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#card)" stroke="#1c3b35" stroke-width="1"/>
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="320" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#edge)"/>
    <rect class="swp" x="0" y="0" width="420" height="3" fill="url(#sweep)"/>
  </g>

  <g class="an d1">
    <circle cx="334" cy="128" r="57" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
    <image clip-path="url(#av)" x="280" y="74" width="108" height="108"
           xlink:href="data:image/jpeg;base64,"/>
  </g>

  <text class="f nm an d2" x="418" y="122">Nilabha Mukherjee</text>
  <text class="f tg an d3" x="420" y="158">SECURITY · IOT · APPLIED AI</text>

  <g class="an d4">
    <rect x="316" y="228" width="132" height="40" rx="20" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1"/>
    <text class="f ch" x="382" y="254" text-anchor="middle" fill="#22d3ee">PYTHON</text>
    <rect x="466" y="228" width="142" height="40" rx="20" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1"/>
    <text class="f ch" x="537" y="254" text-anchor="middle" fill="#2dd4bf">C / C++</text>
    <rect x="626" y="228" width="122" height="40" rx="20" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.55" stroke-width="1"/>
    <text class="f ch" x="687" y="254" text-anchor="middle" fill="#34d399">REACT</text>
    <rect x="766" y="228" width="118" height="40" rx="20" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1"/>
    <text class="f ch" x="825" y="254" text-anchor="middle" fill="#38bdf8">LINUX</text>
  </g>
</svg>
