<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 208" width="1200" height="208" role="img" aria-label="Featured project: Skopia AI">
  <title>Skopia AI — Creator &amp; Lead Developer</title>
  <defs>
    <linearGradient id="f-card" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#12211d"/>
      <stop offset="100%" stop-color="#0a1014"/>
    </linearGradient>
    <linearGradient id="f-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="fc"><rect x="1" y="1" width="1198" height="206" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eb { font-size: 11px; font-weight: 600; letter-spacing: 3px; fill: #4d6f67; }
    .ti { font-size: 40px; font-weight: 700; letter-spacing: -0.8px; fill: #eafff8; }
    .ro { font-size: 13px; font-weight: 600; letter-spacing: 2.6px; fill: #5eead4; }
    .de { font-size: 15px; font-weight: 400; fill: #9fbdb5; }
    .an { opacity: 0; animation: rise .85s cubic-bezier(.16,1,.3,1) forwards; }
    .a1 { animation-delay: .06s; } .a2 { animation-delay: .16s; }
    .a3 { animation-delay: .26s; } .a4 { animation-delay: .34s; }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .an { animation: none; opacity: 1; } }
  </style>

  <rect x="1" y="1" width="1198" height="206" rx="20" fill="url(#f-card)" stroke="#1c3b35" stroke-width="1"/>
  <g clip-path="url(#fc)"><rect x="0" y="0" width="5" height="208" fill="url(#f-bar)"/></g>

  <text class="f eb an a1" x="48" y="50">FEATURED PROJECT</text>
  <text class="f ti an a2" x="48" y="100">Skopia AI</text>
  <text class="f ro an a2" x="256" y="98">CREATOR &amp; LEAD DEVELOPER</text>
  <text class="f de an a3" x="48" y="144">OT cybersecurity platform for centralized substation SOCs — Sigma detection engine, live Modbus / DNP3 / IEC</text>
  <text class="f de an a4" x="48" y="170">parsers, OT deep-packet inspection and an analyst console. Pure Python; deploys on-premises and air-gapped.</text>
</svg>
