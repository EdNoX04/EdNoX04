<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 232" width="1280" height="232" role="img" aria-label="Nilabha Mukherjee — Security systems, IoT, Applied AI">
  <title>Nilabha Mukherjee</title>
  <style>
    .t  { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .nm { font-size: 68px; font-weight: 600; letter-spacing: -1.9px; fill: #f5f5f7; }
    .sb { font-size: 19px; font-weight: 400; letter-spacing: 0.3px; fill: #86868b; }
    .rl { stroke: #3d444d; stroke-width: 1; }
    .an { opacity: 0; animation: rise .9s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay: .06s; }
    .d2 { animation-delay: .20s; }
    .d3 { animation-delay: .34s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .an { animation: none; opacity: 1; }
    }
  </style>
  <text class="t nm an d1" x="640" y="114" text-anchor="middle">Nilabha Mukherjee</text>
  <text class="t sb an d2" x="640" y="158" text-anchor="middle">Security systems · IoT · Applied AI</text>
  <line class="rl an d3" x1="545" y1="200" x2="735" y2="200" />
</svg>
