<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Contact">
  <title>Contact</title>
  <defs>
    <linearGradient id="c2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#13211e"/>
      <stop offset="100%" stop-color="#0c1316"/>
    </linearGradient>
    <clipPath id="cc"><rect x="1" y="1" width="1198" height="168" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .lb { font-size: 13px; font-weight: 600; letter-spacing: 2.6px; fill: #4d6f67; }
    .vl { font-size: 17px; font-weight: 500; }
    .an { animation: rise .8s cubic-bezier(.16,1,.3,1); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { .an { animation: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="168" rx="20" fill="url(#c2)" stroke="#1c3b35" stroke-width="1"/>
  <g clip-path="url(#cc)">
    <g class="an">
      <text class="f lb" x="150" y="66" text-anchor="middle">EMAIL</text>
      <text class="f vl" x="150" y="100" text-anchor="middle" font-size="16" fill="#34d399">ednox042004@gmail.com</text>
      <rect x="65" y="164" width="170" height="4" rx="2" fill="#34d399"/>
    </g>
    <g class="an">
      <text class="f lb" x="450" y="66" text-anchor="middle">LINKEDIN</text>
      <text class="f vl" x="450" y="100" text-anchor="middle" font-size="16" fill="#38bdf8">Nilabha Mukherjee</text>
      <rect x="365" y="164" width="170" height="4" rx="2" fill="#38bdf8"/>
    </g>
    <g class="an">
      <text class="f lb" x="750" y="66" text-anchor="middle">WEBSITE</text>
      <text class="f vl" x="750" y="100" text-anchor="middle" font-size="17" fill="#2dd4bf">nilabha.dev</text>
      <rect x="665" y="164" width="170" height="4" rx="2" fill="#2dd4bf"/>
    </g>
    <g class="an">
      <text class="f lb" x="1050" y="66" text-anchor="middle">EDUCATION</text>
      <text class="f vl" x="1050" y="100" text-anchor="middle" font-size="16" fill="#22d3ee">Amity University</text>
      <rect x="965" y="164" width="170" height="4" rx="2" fill="#22d3ee"/>
    </g>
  </g>
</svg>
